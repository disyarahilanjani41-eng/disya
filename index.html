<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resep Masakan Nusantara</title>
    <style>
        /* --- RESET & VARIABLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #ff6b6b;
            --primary-dark: #ee5253;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --text-muted: #636e72;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* --- HEADER --- */
        header {
            background: linear-gradient(135deg, #ff6b6b, #ee5253);
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        /* --- CONTROLS --- */
        .controls {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .search-bar {
            width: 100%;
            max-width: 450px;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .categories {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .category-btn.active, .category-btn:hover {
            background-color: white;
            color: var(--primary-dark);
            border-color: white;
            font-weight: bold;
        }

        /* --- MAIN GRID --- */
        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        /* --- CARD --- */
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #eee;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-tag {
            align-self: flex-start;
            background-color: #ffeaa7;
            color: #d63031;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.2rem;
            margin-bottom: 6px;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }

        .btn-detail {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .btn-detail:hover {
            background-color: var(--primary-dark);
        }

        .fav-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #b2bec3;
        }

        .fav-btn.active {
            color: #e74c3c;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 10px;
            overflow-y: auto;
            position: relative;
            padding: 25px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .modal-section {
            margin-top: 15px;
        }

        .modal-section h3 {
            margin-bottom: 8px;
            color: var(--primary-dark);
            border-bottom: 1px solid #eee;
            padding-bottom: 4px;
            font-size: 1.1rem;
        }

        .modal-section ul, .modal-section ol {
            padding-left: 20px;
            font-size: 0.9rem;
        }

        .modal-section li {
            margin-bottom: 6px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #2d3436;
            color: white;
            margin-top: 40px;
            font-size: 0.85rem;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 30px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>Resep Masakan Nusantara</h1>
        <p>Cari resep favoritmu dan mulai memasak!</p>
        <div class="controls">
            <input type="text" id="searchInput" class="search-bar" placeholder="Cari resep...">
            <div class="categories">
                <button class="category-btn active" data-category="all">Semua</button>
                <button class="category-btn" data-category="Utama">Utama</button>
                <button class="category-btn" data-category="Kuah">Kuah</button>
                <button class="category-btn" data-category="Cemilan">Cemilan</button>
                <button class="category-btn" data-category="favorit">Favorit Saya</button>
            </div>
        </div>
    </header>

    <main>
        <div class="recipe-grid" id="recipeContainer"></div>
    </main>

    <div class="modal-overlay" id="recipeModal">
        <div class="modal-content">
            <button class="close-btn" id="closeModal">&times;</button>
            <h2 class="modal-title" id="modalTitle">Judul Resep</h2>
            <img id="modalImg" src="" alt="" style="width: 100%; height: 200px; object-fit: cover; border-radius: 6px;">
            
            <div class="modal-section">
                <h3>Bahan-Bahan</h3>
                <ul id="modalIngredients"></ul>
            </div>

            <div class="modal-section">
